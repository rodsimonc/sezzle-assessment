# One service: the Go binary serves the React bundle and the API on port 8080.
# Settings come from .env (copy .env.example) and fall back to the defaults written here.
name: calculator

services:
  calculator:
    build:
      context: .
    image: calculator:1.0.0
    ports:
      - "8080:8080"
    environment:
      LISTEN_HOST: 0.0.0.0
      PORT: "8080"
      STATIC_DIR: /app/web
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-30}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped
    # The service writes nothing to disk, so the root filesystem can be read-only.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
